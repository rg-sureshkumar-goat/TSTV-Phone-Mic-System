[package]
name = "tstv-phone-mics"
version = "0.1.0"
description = "TSTV Phone Mics desktop app"
edition = "2024"

[dependencies]
cpal = "0.18.2"
futures-util = "0.3.34"
local-ip-address = "0.6.13"
log = "0.4.35"
rand = "0.10.3"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simplelog = "0.12.2"
socket2 = "0.6.5"
tauri = { version = "2", features = [] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.30.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mdns-sd = "0.21.7"

[build-dependencies]
cc = "1.11.0"
tauri-build = { version = "2", features = [] }

[lib]
name = "tstv_phone_mics"
crate-type = ["rlib"]

[profile.dev]
# Keep the audio path fast enough even in debug builds.
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
