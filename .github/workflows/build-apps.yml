# Builds the apps this project can't build on a Mac (or that testers may want without one).
# Finished installers are attached to each run under "Artifacts".
name: Build apps

on:
  push:
    branches: [main, m2-full-features]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install build tool
        working-directory: desktop
        run: npm ci
      - name: Run tests
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Build installer
        working-directory: desktop
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: TSTV-Phone-Mics-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run tests and build the APK
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TSTV-Mic-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
